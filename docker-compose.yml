services:
  postgres:
    image: postgres:17-alpine
    container_name: studenthub-postgres
    restart: unless-stopped
    ports:
      # Host port defaults to 5433 so it never clashes with other local projects.
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studenthub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studenthub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
