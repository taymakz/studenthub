name: Registry

on:
  push:
  pull_request:
    paths:
      - "packages/registry/**"
      - ".github/workflows/registry.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Validates every university/major/chart/offering document against its
      # zod schema, checks path/doc consistency and rejects unknown files.
      - name: Validate registry
        run: pnpm --filter @workspace/registry validate
